<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서울 — Seoul Standard Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f5efe4;
    --ink: #1c1a17;
    --dancheong-blue: #1f4e5f;
    --dancheong-green: #2f5d4e;
    --dancheong-red: #a63a2f;
    --dancheong-gold: #c99a3e;
    --line: rgba(28, 26, 23, 0.14);
    --muted: rgba(28, 26, 23, 0.56);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(31, 78, 95, 0.05), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(166, 58, 47, 0.05), transparent 40%);
    color: var(--ink);
    font-family: 'Noto Serif KR', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .frame {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 960px;
    width: 100%;
    margin: 0 auto;
    padding: 48px 32px 32px;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--line);
    padding-bottom: 20px;
  }

  .locale-mark {
    font-size: 15px;
    letter-spacing: 0.04em;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .locale-mark strong {
    color: var(--ink);
    font-weight: 700;
  }

  .utc-offset {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: var(--muted);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 40px 0;
  }

  .hangul-label {
    font-size: 22px;
    color: var(--dancheong-blue);
    font-weight: 600;
    margin-bottom: 8px;
  }

  .city-label {
    font-size: 16px;
    color: var(--muted);
    letter-spacing: 0.05em;
    margin-bottom: 44px;
  }

  .clock {
    font-family: 'Space Mono', monospace;
    font-size: clamp(64px, 14vw, 148px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.01em;
    color: var(--ink);
    position: relative;
    display: inline-flex;
    align-items: baseline;
    gap: 2px;
  }

  .clock .sep {
    color: var(--dancheong-red);
    animation: blink 2s steps(1) infinite;
  }

  .clock .seconds {
    font-size: 0.42em;
    color: var(--dancheong-green);
    margin-left: 14px;
    align-self: center;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0.25; }
  }

  .date-row {
    margin-top: 28px;
    font-size: 17px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .date-row .dot {
    width: 5px;
    height: 5px;
    background: var(--dancheong-gold);
    border-radius: 50%;
    display: inline-block;
  }

  .accent-bar {
    display: flex;
    height: 4px;
    width: 220px;
    margin-top: 40px;
    border-radius: 2px;
    overflow: hidden;
  }

  .accent-bar span {
    flex: 1;
  }

  .accent-bar span:nth-child(1) { background: var(--dancheong-blue); }
  .accent-bar span:nth-child(2) { background: var(--dancheong-red); }
  .accent-bar span:nth-child(3) { background: var(--dancheong-gold); }
  .accent-bar span:nth-child(4) { background: var(--dancheong-green); }

  footer {
    border-top: 1px solid var(--line);
    padding-top: 18px;
    display: flex;
    justify-content: space-between;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  @media (max-width: 560px) {
    .frame {
      padding: 32px 20px 24px;
    }

    header {
      flex-direction: column;
      align-items: flex-start;
      gap: 6px;
    }

    .clock .seconds {
      display: block;
      margin-left: 0;
      margin-top: 12px;
    }

    footer {
      flex-direction: column;
      gap: 6px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .clock .sep {
      animation: none;
    }
  }
</style>
</head>
<body>
<div class="frame">
  <header>
    <div class="locale-mark"><strong>KST</strong> · Korea Standard Time</div>
    <div class="utc-offset">UTC+09:00</div>
  </header>

  <main>
    <div class="hangul-label">서울</div>
    <div class="city-label">SEOUL, SOUTH KOREA</div>

    <div class="clock" id="clock">
      <span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="seconds" id="seconds">00</span>
    </div>

    <div class="date-row">
      <span id="weekday">-</span>
      <span class="dot"></span>
      <span id="fulldate">-</span>
    </div>

    <div class="accent-bar">
      <span></span><span></span><span></span><span></span>
    </div>
  </main>

  <footer>
    <span>REAL-TIME CLOCK</span>
    <span id="localRef">-</span>
  </footer>
</div>

<script>
  const WeekdayNames = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];
  const MonthNames = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

  function UpdateClock() {
    const Now = new Date();
    const KstString = Now.toLocaleString("en-US", { timeZone: "Asia/Seoul" });
    const Kst = new Date(KstString);

    const Hours = String(Kst.getHours()).padStart(2, "0");
    const Minutes = String(Kst.getMinutes()).padStart(2, "0");
    const Seconds = String(Kst.getSeconds()).padStart(2, "0");

    document.getElementById("hours").textContent = Hours;
    document.getElementById("minutes").textContent = Minutes;
    document.getElementById("seconds").textContent = Seconds;

    document.getElementById("weekday").textContent = WeekdayNames[Kst.getDay()];
    document.getElementById("fulldate").textContent =
      Kst.getDate() + " " + MonthNames[Kst.getMonth()] + " " + Kst.getFullYear();

    const LocalOffset = -Now.getTimezoneOffset() / 60;
    const Sign = LocalOffset >= 0 ? "+" : "";
    document.getElementById("localRef").textContent =
      "YOUR LOCAL UTC" + Sign + LocalOffset;
  }

  UpdateClock();
  setInterval(UpdateClock, 1000);
</script>
</body>
</html>
